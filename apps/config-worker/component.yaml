apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: config-worker
  description: Cloudflare Worker for the Config read-only API surface
spec:
  docs:
    overview: docs/overview.md
    pages:
      - { path: docs/architecture.md, role: architecture }
      - { path: docs/runbook.md, role: runbook }
  type: cloudflare-worker-turbo
  lifecycle: production
  owner: platform
  domain: starter-runtime
  path: apps/config-worker
  dependsOn:
    # ENFORCED ON MAIN: the data plane before anything that reads its wiring,
    # and policy-worker before anything that holds a service binding — its
    # pre-deploy creates a placeholder for every binding target that does not
    # exist yet (tooling/deploy/fleet-stubs.mjs), so each worker's first
    # deploy can carry its full bindings. Peer edges stay advisory: they are
    # runtime calls, not deploy order. A pull request deploys nothing, so
    # nothing on one waits.
    - component: membership-worker
    - component: policy-worker
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
    # Shared workspace packages this component BUNDLES. Declared so a change
    # to one marks this component changed and redeploys it — without the
    # edge, `orun plan --changed` keys on `path:` alone and a worker can run
    # a months-old copy of a package that has since changed underneath it.
    - component: contracts
    - component: db
  # Runtime secrets, wire-now-seed-later: best-effort references —
  # an unseeded key is skipped at resolve (and by secrets-live), so
  # this block is inert until the value is stored in orun secrets.
  optionalSecretEnv:
    SECRET_ENCRYPTION_KEY: "secret://ws_0014GSP6/kuyil/{{ .environment }}/SECRET_ENCRYPTION_KEY"

  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        # Peer edges are runtime calls, not deploy order: every binding
        # target exists before this deploys (policy-worker's pre-deploy
        # places one, tooling/deploy/fleet-stubs.mjs), so nothing in this
        # lane waits on a peer. The edges marked `mode: enforced` above
        # still order.
        dependencyMode: advisory
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_0014GSP6/kuyil/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_0014GSP6/kuyil/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        # Peer edges are runtime calls, not deploy order: every binding
        # target exists before this deploys (policy-worker's pre-deploy
        # places one, tooling/deploy/fleet-stubs.mjs), so nothing in this
        # lane waits on a peer. The edges marked `mode: enforced` above
        # still order.
        dependencyMode: advisory
        profile: verify
        # wire-live (deploy profile) is the only reader, and dev never
        # deploys — scoping keeps dev jobs from requiring stage+prod
        # credentials they can never use. See specs/profiles/free-tier.md.
        secretEnv:
          WIRING_CLOUDFLARE_HYPERDRIVE_STAGE: "secret://ws_0014GSP6/kuyil/stage/WIRING_CLOUDFLARE_HYPERDRIVE"
          WIRING_CLOUDFLARE_HYPERDRIVE_PROD: "secret://ws_0014GSP6/kuyil/prod/WIRING_CLOUDFLARE_HYPERDRIVE"
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    workspaceDir: ../..
    appDir: .
    # BF6b: deploy-time wiring — wrangler.jsonc is rendered, never committed.
    # Verify lanes render from wiring.fixture.json (offline); deploy lanes
    # resolve real IDs from the Secrets Manager wiring manifest (BF5).
    orgName: sourceplane
    owner: sourceplane
    repo: kuyil

    # Runtime worker secrets, pushed by the secrets-live step from the
    # values orun resolves for the optionalSecretEnv references below.
    runtimeSecrets: "SECRET_ENCRYPTION_KEY"
    turboFilter: "@saas/config-worker"
    wranglerConfig: wrangler.jsonc
    wranglerTemplate: wrangler.template.jsonc
    wiringComponents: "cloudflare-hyperdrive"
    wiringEnvs: "stage,prod"
    wiringFixture: wiring.fixture.json
    installCommand: pnpm install --frozen-lockfile
    buildCommand: pnpm exec turbo run build --filter=@saas/config-worker
    typecheckCommand: pnpm exec turbo run typecheck --filter=@saas/config-worker
    dryRunCommand: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc --env prod
    deployCommand: pnpm exec wrangler deploy --config wrangler.jsonc --env prod
    # Safety net: ensure the secrets-at-rest encryption key exists on every
    # deploy target before the worker ships. Generate-if-missing, idempotent —
    # `wrangler secret list` is the existence probe; the key is generated in
    # CI, pushed straight to Cloudflare, and never logged or persisted
    # elsewhere. The MANAGED path is orun secrets: seed SECRET_ENCRYPTION_KEY
    # (escrow the CURRENTLY DEPLOYED value — a fresh key bricks stored data)
    # and the secrets-live step keeps the worker in sync; this pre-deploy
    # probe then always finds the key present and does nothing. Remove it
    # once the key is seeded in orun.
    preDeployCommand: |
      for e in stage prod; do
        if ! pnpm exec wrangler secret list --config wrangler.jsonc --env "$e" 2>/dev/null | grep -q '"SECRET_ENCRYPTION_KEY"'; then
          echo "Provisioning SECRET_ENCRYPTION_KEY for env $e"
          openssl rand -hex 32 | pnpm exec wrangler secret put SECRET_ENCRYPTION_KEY --config wrangler.jsonc --env "$e"
        else
          echo "SECRET_ENCRYPTION_KEY already present for env $e"
        fi
      done
    migrationCommand: "echo 'No migrations configured.'"
    smokeCommand: "echo 'No smoke test configured.'"
  labels:
    team: platform
    layer: runtime
    surface: config
    runtime: cloudflare
# ci: re-trigger deploy (batch B — membership-dependents, 20260622T140838Z)
# orun: redeploy 04-workers 20261102T075852Z
